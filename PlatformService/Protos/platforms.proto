syntax = "proto3";

option csharp_namespace = "PlatformService";


service GrpcPlatform{
    rpc GetAllPlatfroms (GetAllRequest) returns (PlatformResponce);
}

message GetAllRequest {}

message GrpcPlatfromModel{
    int32 platformId = 1;
    string name = 2;
    string publisher = 3;
}

message PlatformResponce{
    repeated GrpcPlatfromModel platform = 1;
}