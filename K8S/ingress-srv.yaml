apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microservices-route
spec:
  parentRefs:
    - name: my-gateway

  hostnames:
    - acme.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/platforms
      backendRefs:
        - name: platforms-clusterip-srv
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /api/k/platforms
      backendRefs:
        - name: command-clusterip-srv
          port: 8080